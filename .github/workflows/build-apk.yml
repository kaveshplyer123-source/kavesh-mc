name: Build Kavesh-MC APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Download PumpkinMC ARM64 Binary
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          curl -L -o app/src/main/jniLibs/arm64-v8a/libpumpkin.so https://github.com/Pumpkin-MC/Pumpkin/releases/latest/download/pumpkin-ARM64-Linux || true

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload Kavesh-MC APK
        uses: actions/upload-artifact@v4
        with:
          name: kavesh-mc-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
